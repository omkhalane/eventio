name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI checks
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in {1..90}; do
            checks="$(gh pr checks "$PR_URL" --json name,bucket 2>/dev/null || true)"

            # Ignore this workflow's own check while it is running.
            checks="$(echo "$checks" | jq '[.[] | select(.name != "Enable auto-merge" and .name != "Dependabot auto-merge")]')"

            if [ "$checks" = "[]" ]; then
              echo "Waiting for CI checks to appear..."
              sleep 10
              continue
            fi

            echo "$checks"

            if echo "$checks" | jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel")' >/dev/null; then
              echo "A CI check failed/cancelled. PR will not be merged."
              exit 1
            fi

            if echo "$checks" | jq -e 'any(.[]; .bucket == "pending")' >/dev/null; then
              echo "CI is still running..."
              sleep 10
              continue
            fi

            echo "All reported CI checks passed."
            exit 0
          done

          echo "Timed out waiting for CI checks."
          exit 1

      - name: Approve Dependabot PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "$PR_URL" --approve || true

      - name: Squash merge Dependabot PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$HEAD_SHA"
