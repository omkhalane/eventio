name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PR checks
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for attempt in {1..90}; do
            checks="$(gh pr checks "$PR_URL" --json bucket,name 2>/dev/null || true)"

            if [ -z "$checks" ] || [ "$checks" = "[]" ]; then
              echo "Checks have not appeared yet; waiting..."
              sleep 10
              continue
            fi

            echo "$checks"

            if echo "$checks" | jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel")' >/dev/null; then
              echo "A required PR check failed or was cancelled. Leaving PR open."
              exit 1
            fi

            if echo "$checks" | jq -e 'any(.[]; .bucket == "pending")' >/dev/null; then
              echo "Checks are still running..."
              sleep 10
              continue
            fi

            echo "All reported PR checks passed."
            break
          done

          if [ "$attempt" = "90" ]; then
            echo "Timed out waiting for PR checks."
            exit 1
          fi

      - name: Squash merge Dependabot PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
